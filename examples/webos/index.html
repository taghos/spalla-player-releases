<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Spalla Player · webOS</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="app">
      <section class="app__lista" id="lista" aria-label="Conteúdos">
        <h1 class="app__titulo">Spalla Player</h1>
        <ul class="app__itens" id="itens"></ul>
        <p class="app__dica">
          Setas navegam · OK abre · BACK volta
          <span class="app__versao" id="versao"></span>
        </p>
      </section>

      <section class="app__player hidden" id="palco">
        <div id="player"></div>
        <div class="app__diagnostico" id="diagnostico">
          <div id="tecla">aperte uma tecla</div>
        </div>
      </section>
    </main>

    <script src="webOSTVjs-1.2.13/webOSTV.js"></script>
    <script src="spalla-player.js"></script>
    <script src="app.js"></script>
  </body>
</html>
